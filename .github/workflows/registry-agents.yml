name: Registry Agents Quality

on:
  pull_request:
    paths:
      - 'functions/**'
      - '.github/workflows/registry-agents.yml'
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/registry-agents.yml'

permissions:
  contents: read

concurrency:
  group: registry-agents-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test, typecheck, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
